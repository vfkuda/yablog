services:
  postgres:
    image: postgres:16-alpine
    container_name: yablog-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d blog_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  blog-server:
    build:
      context: .
      dockerfile: Dockerfile.blog-server
    image: yablog-server-image
    container_name: yablog-server
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/blog_db
      JWT_SECRET: change-me-please-minimum-32-characters-secret-key
      APP_ENV: production
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "50051:50051"

  blog-wasm:
    build:
      context: .
      dockerfile: Dockerfile.blog-wasm
    image: yablog-wasm-image
    container_name: yablog-wasm
    depends_on:
      - blog-server
    ports:
      - "8081:80"
